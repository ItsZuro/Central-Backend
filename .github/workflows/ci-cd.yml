name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas y empaquetado
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas y empaquetado
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  container:
    name: Imagen Docker, health check y publicación
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: central_ci
      POSTGRES_PASSWORD: central_ci_password
      POSTGRES_DB: central_ci
      REDIS_PASSWORD: central_ci_redis_password
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-email-password
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_NAME: central-ci-bucket
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_MAPS_API_KEY: ci-maps-key
      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      NIUBIZ_MERCHANT_ID: ci-merchant
      NIUBIZ_USER: ci-user
      NIUBIZ_PASSWORD: ci-password
      APP_FRONTEND_URL: http://localhost:8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir e iniciar los servicios
        run: docker compose up --detach --build

      - name: Comprobar estado del backend
        run: >-
          curl --retry 30 --retry-delay 5 --retry-all-errors
          --fail --silent --show-error
          http://localhost:8081/actuator/health

      - name: Comprobar endpoint de productos
        run: >-
          curl --retry 10 --retry-delay 3 --retry-all-errors
          --fail --silent --show-error
          http://localhost:8081/api/v1/products
          --output /dev/null

      - name: Mostrar servicios validados
        run: docker compose ps

      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen validada en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag central-backend:local "${{ secrets.DOCKER_USERNAME }}/central-backend:latest"
          docker tag central-backend:local "${{ secrets.DOCKER_USERNAME }}/central-backend:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/central-backend:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/central-backend:${{ github.sha }}"

      - name: Mostrar logs si falla la validación
        if: failure()
        run: docker compose logs --no-color

      - name: Eliminar entorno de validación
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans
