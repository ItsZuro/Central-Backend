name: Backend CI/CD

on:
  push:
    branches: [main, feature/cloud-final-project, 'feat/admin-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas y empaquetado
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas y empaquetado
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Guardar JAR validado para ECR
        if: github.ref == 'refs/heads/feature/cloud-final-project'
        uses: actions/upload-artifact@v4
        with:
          name: central-backend-tested-jar
          path: target/centralres-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

  container:
    name: Imagen Docker, health check y publicación
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: central_ci
      POSTGRES_PASSWORD: central_ci_password
      POSTGRES_DB: central_ci
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-email-password
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_NAME: central-ci-bucket
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_MAPS_API_KEY: ci-maps-key
      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      NIUBIZ_MERCHANT_ID: ci-merchant
      NIUBIZ_USER: ci-user
      NIUBIZ_PASSWORD: ci-password
      APP_FRONTEND_URL: http://localhost:8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir e iniciar los servicios
        run: docker compose up --detach --build

      - name: Comprobar estado del backend
        run: >-
          curl --retry 30 --retry-delay 5 --retry-all-errors
          --fail --silent --show-error
          http://localhost:8081/actuator/health

      - name: Comprobar endpoint de productos
        run: >-
          curl --retry 10 --retry-delay 3 --retry-all-errors
          --fail --silent --show-error
          http://localhost:8081/api/v1/products
          --output /dev/null

      - name: Verificar API pública y protección de rutas privadas
        run: |
          set -euo pipefail
          BASE=http://localhost:8081/api/v1
          curl --fail --silent --show-error "$BASE/reviews/product/1" --output /dev/null
          curl --fail --silent --show-error "$BASE/tables/available-times?numberOfPeople=2&date=2030-05-02" --output /dev/null
          for path in "/orders/me" "/orders/delivery/assigned-me" "/payments" "/orders/delivery/quote?latitude=-14&longitude=-75"; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE$path")
            if [ "$status" != "401" ] && [ "$status" != "403" ]; then
              echo "Se esperaba autenticación para $path (HTTP $status)" >&2
              exit 1
            fi
          done
          for path in "/reservations/me" "/payments/niubiz/start"; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE$path")
            if [ "$status" != "401" ] && [ "$status" != "403" ]; then
              echo "Se esperaba autenticación para $path (HTTP $status)" >&2
              exit 1
            fi
          done

      - name: Mostrar servicios validados
        run: docker compose ps

      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen validada en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag central-backend:local "${{ secrets.DOCKER_USERNAME }}/central-backend:latest"
          docker tag central-backend:local "${{ secrets.DOCKER_USERNAME }}/central-backend:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/central-backend:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/central-backend:${{ github.sha }}"

      - name: Mostrar logs si falla la validación
        if: failure()
        run: docker compose logs --no-color

      - name: Eliminar entorno de validación
        if: always()
        continue-on-error: true
        run: docker compose down --volumes --remove-orphans

  ecr-publish:
    name: Publicar imagen validada en Amazon ECR
    needs: container
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feature/cloud-final-project'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Obtener credenciales AWS temporales mediante GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::431223004152:role/central-github-ecr-push-role
          aws-region: us-east-1
          role-session-name: restaurant-central-ecr-${{ github.run_id }}

      - name: Autenticarse en Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Descargar JAR compilado y validado por quality
        uses: actions/download-artifact@v4
        with:
          name: central-backend-tested-jar
          path: target

      # El repositorio ECR tiene etiquetas inmutables: no usar 'latest'.
      # El identificador de intento evita colisiones también al reejecutar un workflow.
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ecr
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/central-backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mostrar referencia publicada
        run: echo "Imagen publicada en ECR con etiqueta $GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  ecs-deploy:
    name: Desplegar revisión validada en Amazon ECS
    needs: ecr-publish
    # Solo se activa cuando el propietario autoriza IAM y habilita la variable.
    if: github.ref == 'refs/heads/feature/cloud-final-project' && vars.ENABLE_BACKEND_ECS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "431223004152"
      ECS_CLUSTER: central-cluster
      ECS_SERVICE: central-backend-service
      ECS_TASK_FAMILY: central-backend-task
      ECS_CONTAINER: central-backend
      ECR_REPOSITORY: central-backend

    steps:
      - name: Obtener credenciales AWS mediante GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::431223004152:role/central-github-ecs-deploy-role
          aws-region: us-east-1
          role-session-name: restaurant-central-ecs-${{ github.run_id }}

      - name: Registrar revisión y actualizar solo el contenedor backend
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || { echo "Cuenta AWS inesperada" >&2; exit 1; }

          OLD_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          if [[ -z "$OLD_TASK" || "$OLD_TASK" == "None" ]]; then
            echo "El servicio ECS no existe o no tiene definición de tarea" >&2
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$OLD_TASK" --region "$AWS_REGION" \
            --query taskDefinition --output json > /tmp/central-current-task.json

          jq -e --arg family "$ECS_TASK_FAMILY" --arg container "$ECS_CONTAINER" \
            '.family == $family and ([.containerDefinitions[].name] | index($container) != null)' \
            /tmp/central-current-task.json > /dev/null || {
              echo "El nombre de la familia o del contenedor no coincide con ECS" >&2
              exit 1
            }

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          jq --arg image "$IMAGE" --arg container "$ECS_CONTAINER" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions |= map(
                if .name == $container then
                  .image = $image
                  | .environment = (
                      (.environment // [])
                      | map(select(.name != "SPRING_PROFILES_ACTIVE"
                              and .name != "DB_SSLMODE"
                              and .name != "JPA_DDL_AUTO"))
                      + [{"name": "SPRING_PROFILES_ACTIVE", "value": "prod"},
                         {"name": "DB_SSLMODE", "value": "require"},
                         {"name": "JPA_DDL_AUTO", "value": "none"}]
                    )
                else . end
              )
          ' /tmp/central-current-task.json > /tmp/central-new-task.json

          NEW_TASK=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/central-new-task.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Actualizando $ECS_CLUSTER/$ECS_SERVICE a $NEW_TASK"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK" --region "$AWS_REGION" > /dev/null

          if ! aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION"; then
            echo "ECS no se estabilizó. Restaurando la revisión previa: $OLD_TASK" >&2
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "$OLD_TASK" --region "$AWS_REGION" > /dev/null || true
            exit 1
          fi

          ACTUAL=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          RUNNING=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].runningCount' --output text)
          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].desiredCount' --output text)

          if [[ "$ACTUAL" != "$NEW_TASK" || "$RUNNING" -lt 1 || "$RUNNING" -ne "$DESIRED" ]]; then
            echo "ECS no terminó con la revisión o cantidad de tareas esperada" >&2
            exit 1
          fi
          echo "ECS actualizado: $ACTUAL ($RUNNING/$DESIRED tareas)"
