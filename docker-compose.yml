services:
  postgres:
    image: postgres:16
    container_name: restaurante_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env.properties}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.properties}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env.properties}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: restaurante_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env.properties}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env.properties}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: central-backend:local
    container_name: restaurante_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env.properties}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.properties}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env.properties}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env.properties}
      EMAIL_USERNAME: ${EMAIL_USERNAME:?Define EMAIL_USERNAME in .env.properties}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?Define EMAIL_PASSWORD in .env.properties}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?Define AWS_S3_BUCKET_NAME in .env.properties}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Define AWS_ACCESS_KEY_ID in .env.properties}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Define AWS_SECRET_ACCESS_KEY in .env.properties}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Define GOOGLE_CLIENT_ID in .env.properties}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Define GOOGLE_CLIENT_SECRET in .env.properties}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Define GOOGLE_MAPS_API_KEY in .env.properties}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env.properties}
      NIUBIZ_MERCHANT_ID: ${NIUBIZ_MERCHANT_ID:?Define NIUBIZ_MERCHANT_ID in .env.properties}
      NIUBIZ_USER: ${NIUBIZ_USER:?Define NIUBIZ_USER in .env.properties}
      NIUBIZ_PASSWORD: ${NIUBIZ_PASSWORD:?Define NIUBIZ_PASSWORD in .env.properties}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  postgres_data:
  redis_data:
