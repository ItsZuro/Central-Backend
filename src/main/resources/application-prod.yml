spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=${DB_SSLMODE:disable}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

app:
  demo:
    seed-users: false
    seed-tables: false
  frontend:
    url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}